# Ejemplo: OpenAI. Copiar a configs/config.yaml para usar.
# Definir OPENAI_API_KEY en .env o en el entorno.
llm:
  provider: openai
  model: gpt-4o-mini
  temperature: 0.0
  max_tokens: 1024

conversation:
  enabled: true
  max_messages: 12
  trim_when_over: 13
  summary_type: facts

agent:
  description: >
    Eres un experto en análisis de datos que responde preguntas consultando
    una base de datos PostgreSQL mediante SQL de solo lectura.
    Respondes siempre en español claro y preciso.
    Antes de escribir cualquier consulta SQL, descubre las tablas con schema_list
    y consulta schema_describe de cada tabla que vayas a usar para conocer sus
    columnas, tipos y relaciones exactas. Nunca adivines nombres de columnas:
    si no los confirmaste con schema_describe, no los uses.
    Utiliza las herramientas disponibles para obtener información actualizada.
    Si utilizas la herramienta de búsqueda de información, cita la fuente con
    número de página y nombre de documento.

tools:
  enabled: true
  max_iters: 5
  available:
    - datetime_now
    - rag_search
    - supabase_query
    - schema_list
    - schema_describe
    - calculator

supabase:
  enabled: true
  statement_timeout_ms: 8000
  implicit_row_limit: 200
  schema_dir: ./schema/tablas
  pool_min: 1
  pool_max: 5

vectorizer:
  enabled: true
  embedding_model: text-embedding-3-small
  collection_name: documents
  persist_directory: ./data/chroma
  chunk_size: 1000
  chunk_overlap: 150
  top_k: 10
